# CI : lint uniquement.
# Les tests unitaires demandent l'environnement complet (TensorFlow macOS,
# données locales) : ils tournent en local (`uv run pytest`), pas sur les
# serveurs Linux de GitHub. Le lint, lui, n'a besoin que de ruff — installé
# seul, sans résoudre les dépendances du projet.
name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check src tests app scripts
