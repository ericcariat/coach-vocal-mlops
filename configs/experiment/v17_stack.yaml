# Synthèse de la journée du 13 août : tous les leviers validés, chacun à sa
# dose mesurée — RIR (rappel +12), SUMM-RE 75 (FA réunions), hard negatives ×2
# (erreurs réelles), élection fa_ambient.
#
# Critère de succès, écrit AVANT le run (banc recomposé, seuil 0.8) :
#   • rappel ≥ 63 % (champion) ET FA/h ≤ 23.5 (champion −20 %) ;
#   • idéal déclaré : rappel ≥ 70 % (l'effet RIR) à FA/h ≤ 20.
# Vérification : coachvocal bench --run v11_speech_300 --run v17_stack --minutes 60
name: v17_stack
description: >
  Cumul rappel-d'abord : RIR/multi-SNR + dose 300 YouTube + SUMM-RE 75 +
  hard negatives ×2, élu par fa_ambient.

wakeword: eloquence
dataset: v17_stack
model: cnn_baseline

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 5
  class_weight: true
  threshold: 0.5
  seeds: [42, 43, 44, 45, 46]
  selection_metric: fa_ambient
  selection_min_val_recall: 0.90
  use_gpu: false
