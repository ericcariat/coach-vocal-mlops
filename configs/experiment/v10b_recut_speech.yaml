# v10 (re-découpe seule) : rappel 100 % mais 782 FA/h — le modèle a appris
# « parole continue = positif » faute de négatifs du même monde. Ce run teste
# le COUPLE : positifs re-découpés fin-de-fenêtre + 300 fenêtres de parole
# continue en négatif (train seulement).
#
# Critère de succès, écrit AVANT le run (banc étendu, seuil 0.8) :
#   • FA/h ≤ v03_replica (66.7) ET rappel ≥ v03_replica − 2 pts (≥ 74 %) ;
#   • l'espoir déclaré : rappel meilleur (géométrie alignée) à FA/h égales ou
#     moindres. Si FA/h restent > 200 : le couple ne suffit pas, augmenter la
#     dose de parole continue avant de condamner la géométrie.
# Vérification : coachvocal bench --run v03_replica --run v10b_recut_speech --minutes 60
name: v10b_recut_speech
description: >
  Positifs re-découpés fin-de-fenêtre + 300 négatifs de parole continue —
  le couple géométrie/contrepoids, après l'échec instructif de v10 seul.

wakeword: eloquence
dataset: tts500_recut_sn300
model: cnn_baseline

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 5
  class_weight: true
  threshold: 0.5
  seeds: [42, 43, 44, 45, 46]
  selection_metric: val_loss
  use_gpu: false
