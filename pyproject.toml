[project]
name = "coachvocal"
version = "0.1.0"
description = "Coach vocal — détection de wake word, pipeline MLOps de bout en bout"
readme = "README.md"
# tensorflow-macos n'a des wheels que pour Python 3.9–3.11 → projet figé en 3.11
requires-python = ">=3.11,<3.12"
dependencies = [
    # Cœur ML — versions figées sur l'état qui fonctionne sur Apple Silicon
    "numpy==1.26.4",
    "tensorflow-macos==2.16.2",
    "tensorflow-metal==1.2.0",   # inférence seulement (cf. docs/decisions/ADR-002)
    "scikit-learn>=1.4",
    "pandas>=2.2,<3",
    # Audio
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    # Config & CLI
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # Tracking
    "mlflow>=2.14,<3",
    # Restitution
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # UI
    "streamlit>=1.40,<2",
    "plotly>=5.22",
]

[project.scripts]
coachvocal = "coachvocal.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "onnxruntime>=1.28.0",
]
mlops = [
    "dvc>=3.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coachvocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests longs (entraînement réel, banc streaming) — désactivés en CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",    # longueur de ligne : gérée à la relecture, pas par l'outil
    "B008",    # appel dans un défaut : c'est l'idiome FastAPI (File(...), Query(...))
    "B905",    # zip(strict=) : les longueurs sont garanties par construction ici
    "UP045",   # Optional[X] : requis par Typer pour les options de CLI
]
